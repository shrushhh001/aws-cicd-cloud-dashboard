
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Cloud DevOps Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
      text-align: center;
      padding: 60px 20px;
    }
    main {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 24px #00000012;
    }
    .status {
      color: #15803d;
      font-weight: bold;
    }
    .version {
      background: #e0e7ff;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>AWS Cloud DevOps Dashboard</h1>
    <p>My first automated AWS deployment!</p>
    <p class="status">● Application is running</p>
    <p class="version">Application Version: v1.1</p>
    <p>Deployed using AWS CI/CD services.</p>
  </main>
</body>
</html>
